<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 570" width="600" height="570" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">
  <title>DADGPT costume: a phone sits sideways on the brim of a black baseball hat, above the face, with a black t-shirt</title>
  <style>
    .line { fill: #000; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .open { fill: none; }
    .thin { fill: none; stroke: #8d96a0; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .label, .screen { fill: #fff; }
  </style>

  <rect width="600" height="570" fill="#000"/>

  <g transform="translate(60 0)">
    <!-- Head and face, clear below the brim -->
    <ellipse class="line" cx="240" cy="235" rx="62" ry="75"/>
    <circle class="screen" cx="218" cy="245" r="4"/>
    <circle class="screen" cx="262" cy="245" r="4"/>
    <path class="line open" d="M220 276 Q240 292 260 276"/>

    <!-- Hat crown, button, and brim -->
    <path class="line" d="M164 205 C164 52 316 52 316 205 Z"/>
    <circle class="line" cx="240" cy="86" r="5"/>
    <path class="line" d="M136 206 Q240 176 344 206 Q240 226 136 206 Z"/>

    <!-- Phone, sideways, resting on the brim -->
    <rect class="line" x="170" y="130" width="140" height="66" rx="12"/>
    <rect class="line" x="182" y="139" width="116" height="48" rx="4"/>
    <text class="screen" x="240" y="163" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="1">DADGPT</text>
    <circle class="line" cx="240" cy="177" r="5"/>

    <!-- Neck -->
    <path class="line open" d="M220 305 L220 332 M260 305 L260 332"/>

    <!-- T-shirt -->
    <path class="line" d="M220 332 L150 352 L108 422 L145 444 L166 404 L166 550 L314 550 L314 404 L335 444 L372 422 L330 352 L260 332 Q240 350 220 332 Z"/>
  </g>

  <!-- Labels -->
  <g class="label">
    <text x="420" y="94">Black baseball hat</text>
    <text x="420" y="154">Phone, sideways,</text>
    <text x="420" y="174">on the brim</text>
    <text x="16" y="250">Face stays clear,</text>
    <text x="16" y="270">so you can see</text>
    <text x="420" y="480">Black t-shirt</text>
  </g>
  <path class="thin" d="M414 89 L364 110 M414 160 L374 160 M148 255 L268 250 M414 475 L376 475"/>
</svg>
